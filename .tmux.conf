
unbind ^T
bind ^T select-pane -t :.+

bind h split-window -v
bind v split-window -h

set -g mouse on
bind-key    -T copy-mode    MouseDrag1Pane    if-shell -F '#{mouse_any_flag}' 'select-pane -t. ; send-keys -X begin-selection'
bind-key    -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key    -T copy-mode-vi MouseDrag1Pane    if-shell -F '#{mouse_any_flag}' 'select-pane -t. ; send-keys -X begin-selection'
bind-key    -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key    -T root         MouseDrag1Pane    if-shell -F -t = "#{mouse_any_flag}" "if -Ft= \"#{pane_in_mode}\" \"copy-mode -M\" \"send-keys -M\"" "copy-mode -M"
bind-key    -T root         MouseDrag1Border  resize-pane -M

set -s escape-time 200

# Set TMUX plugin path using environment variables
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$TMUX_TMPDIR/plugins"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline 'true'

set -g @dracula-plugins 'cpu-usage ram-usage'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "$TMUX_TMPDIR/plugins/tpm/tpm"
