[project]
name = "hpc-server-tools"
version = "0.1.0"
description = "Server Side Toolkit for HHU HPC Hilbert"
authors = [{ name = "Carel van Niekerk", email = "cvanniekerk@hhu.de" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psutil >= 6.0.0", "gpustat >= 1.1.1", "rich >= 13.7.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend = "~/.config/ruff/config.toml"
target-version = "py312"
